<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cortlin Forums</title>
<link rel="icon" href="https://i.imgur.com/bqOOpyN.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f7f7;
  --surface: #ffffff;
  --border: #e8e8e8;
  --text: #111111;
  --muted: #888888;
  --accent: #2563eb;
  --accent-h: #1d4ed8;
  --danger: #dc2626;
  --success: #16a34a;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #555555;
    --accent: #3b82f6;
    --accent-h: #60a5fa;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: 'DM Sans', sans-serif; cursor: pointer; }
input, textarea, select { font-family: 'DM Sans', sans-serif; }
.hidden { display: none !important; }

nav {
  position: sticky; top: 0; z-index: 200;
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 32px; height: 52px;
}
.nav-logo {
  display: flex; align-items: center; gap: 8px;
  font-weight: 600; font-size: 15px; color: var(--text);
  text-decoration: none; margin-right: 24px; flex-shrink: 0;
}
.nav-logo img { width: 22px; height: 22px; object-fit: contain; }
.nav-tabs { display: flex; gap: 2px; flex: 1; }
.ntab {
  background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--muted); font-size: 13px; font-weight: 500;
  padding: 0 12px; height: 52px; cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.ntab:hover { color: var(--text); }
.ntab.active { color: var(--text); border-bottom-color: var(--accent); }
.nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: none; border-radius: 6px; font-size: 13px; font-weight: 500;
  padding: 7px 16px; cursor: pointer; transition: background 0.15s, opacity 0.15s;
  text-decoration: none; white-space: nowrap;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-h); text-decoration: none; }
.btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--border); text-decoration: none; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { opacity: 0.85; }
.btn-sm { padding: 5px 12px; font-size: 12px; }

.read-bar { display: flex; align-items: center; gap: 8px; font-size: 11px; font-family: 'DM Mono', monospace; color: var(--muted); }
.read-track { width: 72px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
.read-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 1s linear; }
.read-fill.done { background: var(--success); }

.user-chip { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
.avatar.sm { width: 22px; height: 22px; font-size: 10px; }
.badge-img { width: 15px; height: 15px; object-fit: contain; vertical-align: middle; }

.view { display: none; }
.view.active { display: block; }

.wrap { max-width: 860px; margin: 0 auto; padding: 32px 24px; }

.pg-head { margin-bottom: 24px; }
.pg-head h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.4px; margin-bottom: 3px; }
.pg-head p { font-size: 13px; color: var(--muted); }

.back { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 13px; background: none; border: none; cursor: pointer; margin-bottom: 18px; padding: 0; }
.back:hover { color: var(--text); }

.topic-list { display: flex; flex-direction: column; gap: 8px; }
.topic-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: border-color 0.15s; }
.topic-card:hover { border-color: var(--accent); }
.topic-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.topic-info { flex: 1; }
.topic-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
.topic-desc { font-size: 12px; color: var(--muted); }
.topic-count { font-size: 12px; color: var(--muted); white-space: nowrap; font-family: 'DM Mono', monospace; }

.post-list { display: flex; flex-direction: column; gap: 8px; }
.post-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; cursor: pointer; transition: border-color 0.15s; }
.post-card:hover { border-color: var(--accent); }
.post-card-title { font-size: 14px; font-weight: 500; margin-bottom: 5px; }
.post-card-preview { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 10px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.post-card-meta { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.author-row { display: flex; align-items: center; gap: 6px; }

.new-post-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
.new-post-box h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 4px; }
.field input, .field textarea, .field select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; font-size: 13px; color: var(--text); outline: none; transition: border-color 0.15s; }
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 90px; }
.locked-notice { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; font-size: 13px; color: var(--muted); margin-bottom: 16px; }

.post-view { max-width: 720px; margin: 0 auto; padding: 32px 24px; }
.post-title { font-size: 24px; font-weight: 600; letter-spacing: -0.4px; margin-bottom: 12px; }
.post-meta { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); margin-bottom: 24px; flex-wrap: wrap; }
.post-body { font-size: 15px; line-height: 1.75; white-space: pre-wrap; margin-bottom: 32px; }
.divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
.replies-head { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
.reply-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 8px; }
.reply-head { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; font-size: 13px; flex-wrap: wrap; }
.reply-body { font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
.reply-input-area { margin-top: 20px; }
.reply-input-area textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; font-size: 14px; color: var(--text); resize: vertical; min-height: 80px; outline: none; display: block; margin-bottom: 8px; transition: border-color 0.15s; }
.reply-input-area textarea:focus { border-color: var(--accent); }

.staff-panel-wrap { max-width: 1000px; margin: 0 auto; padding: 32px 24px; }
.staff-panel-wrap h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
.staff-panel-wrap > p { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
.ptabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.ptab { background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); font-size: 13px; font-weight: 500; padding: 8px 16px; cursor: pointer; margin-bottom: -1px; transition: color 0.15s, border-color 0.15s; }
.ptab.active { color: var(--text); border-bottom-color: var(--accent); }
.psec { display: none; }
.psec.active { display: block; }

.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--border); }
.tbl td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tbody tr:hover { background: var(--bg); }
.role-pill { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 100px; text-transform: uppercase; letter-spacing: 0.04em; }
.rp-staff { background: #dbeafe; color: #1d4ed8; }
.rp-member { background: var(--border); color: var(--muted); }
.rp-banned { background: #fee2e2; color: var(--danger); }
@media (prefers-color-scheme: dark) {
  .rp-staff { background: #1e3a5f; color: #93c5fd; }
  .rp-member { background: #2a2a2a; color: #666; }
  .rp-banned { background: #3b1111; color: #f87171; }
}
.act-row { display: flex; gap: 6px; flex-wrap: wrap; }

.color-swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.cswatch { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.1s, border-color 0.15s; }
.cswatch:hover { transform: scale(1.1); }
.cswatch.on { border-color: var(--text); }

.settings-wrap { max-width: 600px; margin: 0 auto; padding: 32px 24px; }
.settings-wrap h1 { font-size: 22px; font-weight: 600; margin-bottom: 24px; }
.srow { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
.srow-info h4 { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
.srow-info p { font-size: 12px; color: var(--muted); }
.toggle { position: relative; width: 38px; height: 21px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.tslider { position: absolute; inset: 0; background: var(--border); border-radius: 100px; cursor: pointer; transition: background 0.2s; }
.tslider:before { content: ''; position: absolute; width: 15px; height: 15px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
.toggle input:checked + .tslider { background: var(--accent); }
.toggle input:checked + .tslider:before { transform: translateX(17px); }

.auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 32px; width: 100%; max-width: 380px; }
.auth-logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; margin-bottom: 24px; }
.auth-logo img { width: 26px; height: 26px; object-fit: contain; }
.auth-card h2 { font-size: 19px; font-weight: 600; margin-bottom: 4px; }
.auth-card > p { font-size: 13px; color: var(--muted); margin-bottom: 22px; }
.auth-err { font-size: 12px; color: var(--danger); min-height: 16px; margin-top: 6px; }
.auth-switch { font-size: 13px; color: var(--muted); text-align: center; margin-top: 14px; }
.auth-switch a { color: var(--accent); cursor: pointer; }

.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 400; align-items: center; justify-content: center; padding: 24px; backdrop-filter: blur(3px); }
.modal-bg.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 26px; width: 100%; max-width: 460px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
.modal h2 { font-size: 16px; font-weight: 600; margin-bottom: 18px; }
.modal-foot { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; }

.ban-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.93); z-index: 600; align-items: center; justify-content: center; padding: 24px; backdrop-filter: blur(8px); }
.ban-bg.open { display: flex; }
.ban-box { background: #111; border: 1px solid #2a2a2a; border-radius: 14px; padding: 32px; max-width: 440px; width: 100%; text-align: center; }
.ban-box h2 { font-size: 20px; font-weight: 600; color: var(--danger); margin-bottom: 6px; }
.ban-box > p { font-size: 13px; color: #888; margin-bottom: 16px; }
.ban-details { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; text-align: left; }
.ban-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
.ban-row span:first-child { color: #555; }
.ban-row span:last-child { color: #ccc; font-family: 'DM Mono', monospace; }
.ban-note { font-size: 13px; color: #666; font-style: italic; margin-bottom: 20px; }
.reactivate-check { display: flex; align-items: flex-start; gap: 10px; text-align: left; margin: 16px 0; }
.reactivate-check input { margin-top: 2px; flex-shrink: 0; }
.reactivate-check label { font-size: 13px; color: #aaa; line-height: 1.5; }

.toast { position: fixed; bottom: 20px; right: 20px; z-index: 999; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 7px; font-size: 13px; font-weight: 500; transform: translateY(60px); opacity: 0; transition: transform 0.25s, opacity 0.25s; pointer-events: none; }
.toast.show { transform: translateY(0); opacity: 1; }

.empty { text-align: center; padding: 48px 24px; color: var(--muted); font-size: 13px; }
.mono { font-family: 'DM Mono', monospace; }
</style>
</head>
<body>

<nav id="main-nav" class="hidden">
  <a class="nav-logo" href="index.html">
    <img src="https://i.imgur.com/bqOOpyN.png" alt="Cortlin"> Cortlin
  </a>
  <div class="nav-tabs">
    <button class="ntab active" onclick="goView('home')">Forums</button>
    <button class="ntab" id="ntab-settings" onclick="goView('settings')">Settings</button>
    <button class="ntab hidden" id="ntab-staff" onclick="goView('staff')">Staff Panel</button>
  </div>
  <div class="nav-right" id="nav-right"></div>
</nav>

<div id="view-auth">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo"><img src="https://i.imgur.com/bqOOpyN.png" alt=""> Cortlin Forums</div>
      <h2 id="auth-h"></h2>
      <p id="auth-sub"></p>
      <div class="field"><label>Username</label><input id="a-user" type="text" placeholder="username"></div>
      <div class="field hidden" id="a-dn-f"><label>Display Name</label><input id="a-dn" type="text" placeholder="how others see you"></div>
      <div class="field hidden" id="a-em-f"><label>Email</label><input id="a-em" type="email" placeholder="email@example.com"></div>
      <div class="field"><label>Password</label><input id="a-pw" type="password" placeholder="password"></div>
      <div class="auth-err" id="auth-err"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="submitAuth()">Continue</button>
      <div class="auth-switch" id="auth-sw"></div>
    </div>
  </div>
</div>

<div id="view-home" class="view">
  <div class="wrap">
    <div class="pg-head"><h1>Forums</h1><p>Discussions and updates from the Cortlin community.</p></div>
    <div id="topic-list" class="topic-list"></div>
  </div>
</div>

<div id="view-topic" class="view">
  <div class="wrap">
    <button class="back" onclick="goView('home')">&#8592; Forums</button>
    <div class="pg-head"><h1 id="tv-name"></h1><p id="tv-desc"></p></div>
    <div id="tv-new-post"></div>
    <div id="tv-posts" class="post-list"></div>
  </div>
</div>

<div id="view-post" class="view">
  <div class="post-view">
    <button class="back" id="post-back-btn">&#8592; Back</button>
    <div class="post-title" id="pv-title"></div>
    <div class="post-meta" id="pv-meta"></div>
    <div class="post-body" id="pv-body"></div>
    <hr class="divider">
    <div class="replies-head" id="pv-reply-count">Replies</div>
    <div id="pv-replies"></div>
    <div id="pv-reply-input"></div>
  </div>
</div>

<div id="view-staff" class="view">
  <div class="staff-panel-wrap">
    <h1>Staff Panel</h1>
    <p>Manage users, topics, and posts.</p>
    <div class="ptabs">
      <button class="ptab active" onclick="switchPTab('users',this)">Users</button>
      <button class="ptab" onclick="switchPTab('topics',this)">Topics</button>
      <button class="ptab" onclick="switchPTab('posts',this)">Posts</button>
    </div>
    <div class="psec active" id="psec-users">
      <table class="tbl"><thead><tr><th>Username</th><th>Display Name</th><th>Role</th><th>Verified</th><th>Actions</th></tr></thead><tbody id="staff-users-body"></tbody></table>
    </div>
    <div class="psec" id="psec-topics">
      <div style="margin-bottom:14px"><button class="btn btn-primary btn-sm" onclick="openNewTopicModal()">+ New Topic</button></div>
      <table class="tbl"><thead><tr><th>Topic</th><th>Color</th><th>Posts</th><th></th></tr></thead><tbody id="staff-topics-body"></tbody></table>
    </div>
    <div class="psec" id="psec-posts">
      <table class="tbl"><thead><tr><th>Title</th><th>Author</th><th>Replies</th><th></th></tr></thead><tbody id="staff-posts-body"></tbody></table>
    </div>
  </div>
</div>

<div id="view-settings" class="view">
  <div class="settings-wrap">
    <h1>Settings</h1>
    <div class="srow" id="srow-staff-badge" style="display:none">
      <div class="srow-info"><h4>Show Staff Badge</h4><p>Display your staff badge on posts.</p></div>
      <label class="toggle"><input type="checkbox" id="tog-staff-badge" onchange="saveStaffBadge(this.checked)"><span class="tslider"></span></label>
    </div>
    <div class="srow">
      <div class="srow-info"><h4>Account</h4><p id="set-acct-info"></p></div>
      <button class="btn btn-outline btn-sm" onclick="doSignOut()">Sign out</button>
    </div>
  </div>
</div>

<div class="ban-bg" id="ban-bg"><div id="ban-inner"></div></div>
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeMod()"><div class="modal" id="modal-inner"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, doc, getDoc, setDoc, getDocs, addDoc, updateDoc, deleteDoc, query, where, orderBy, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAfb1PKVSPEuVPzdb3BE9fbMtT8Yade-hY",
  authDomain: "cortlin.firebaseapp.com",
  projectId: "cortlin",
  storageBucket: "cortlin.firebasestorage.app",
  messagingSenderId: "439783582358",
  appId: "1:439783582358:web:ef40a524daaa6d0a77f0b7"
});
const db = getFirestore(app);

let CU = null;
let readSec = 0;
let readTick = null;
let curTopicId = null;
let curPostId = null;
let authMode = "login";
const READ_REQ = 300;

function hashPw(p) {
  let h = 0;
  for (let i = 0; i < p.length; i++) h = Math.imul(31, h) + p.charCodeAt(i) | 0;
  return h.toString(16);
}

function esc(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

function fmtDate(ts) {
  if (!ts) return "";
  const d = ts.seconds ? new Date(ts.seconds * 1000) : new Date(ts);
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

function ini(name) { return (name || "?")[0].toUpperCase(); }

function isPrivileged() { return CU && (CU.role === "staff" || CU.verified); }

function canPost() {
  if (!CU || CU.banned) return false;
  if (CU.role === "staff" || CU.verified) return true;
  return readSec >= READ_REQ;
}

function buildBadges(u) {
  let h = "";
  if (u.authorRole === "staff" && u.showStaffBadge !== false)
    h += `<img src="https://cdn3.emoji.gg/emojis/4269-discord-staff.png" class="badge-img" title="Staff">`;
  if (u.authorVerified)
    h += `<img src="https://en.help.roblox.com/hc/article_attachments/41933934939156" class="badge-img" title="Verified">`;
  return h;
}

function badgeHTMLFromUser(u) {
  let h = "";
  if (u.role === "staff" && u.showStaffBadge !== false)
    h += `<img src="https://cdn3.emoji.gg/emojis/4269-discord-staff.png" class="badge-img" title="Staff">`;
  if (u.verified)
    h += `<img src="https://en.help.roblox.com/hc/article_attachments/41933934939156" class="badge-img" title="Verified">`;
  return h;
}

window.goView = (v) => {
  document.querySelectorAll(".view").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".ntab").forEach(el => el.classList.remove("active"));
  const el = document.getElementById("view-" + v);
  if (el) el.classList.add("active");
  if (v === "home") { document.querySelector(".ntab")?.classList.add("active"); loadTopics(); }
  if (v === "staff") loadStaff();
  if (v === "settings") loadSettings();
};

function showNav() {
  document.getElementById("main-nav").classList.remove("hidden");
  document.getElementById("view-auth").style.display = "none";
}

function updateNav() {
  const nr = document.getElementById("nav-right");
  const st = document.getElementById("ntab-staff");
  if (!CU) {
    nr.innerHTML = `<button class="btn btn-outline btn-sm" onclick="showAuthPage('login')">Sign in</button><button class="btn btn-primary btn-sm" onclick="showAuthPage('signup')">Sign up</button>`;
    st.classList.add("hidden"); return;
  }
  const badges = badgeHTMLFromUser(CU);
  const showBar = !isPrivileged() && readSec < READ_REQ;
  nr.innerHTML = `
    ${showBar ? `<div class="read-bar"><div class="read-track"><div class="read-fill" id="read-fill-el" style="width:0%"></div></div><span id="read-text-el"></span></div>` : ""}
    <div class="user-chip"><div class="avatar">${ini(CU.displayName)}</div><span>${esc(CU.displayName)}</span>${badges}</div>`;
  if (CU.role === "staff") st.classList.remove("hidden"); else st.classList.add("hidden");
  updateReadUI();
}

window.showAuthPage = (mode) => {
  authMode = mode;
  document.getElementById("view-auth").style.display = "";
  document.getElementById("main-nav").classList.add("hidden");
  document.querySelectorAll(".view").forEach(el => el.classList.remove("active"));
  document.getElementById("auth-err").textContent = "";
  document.getElementById("a-user").value = "";
  document.getElementById("a-pw").value = "";
  if (mode === "signup") {
    document.getElementById("auth-h").textContent = "Create account";
    document.getElementById("auth-sub").textContent = "Join the community.";
    document.getElementById("a-dn-f").classList.remove("hidden");
    document.getElementById("a-em-f").classList.remove("hidden");
    document.getElementById("auth-sw").innerHTML = `Have an account? <a onclick="showAuthPage('login')">Sign in</a>`;
  } else {
    document.getElementById("auth-h").textContent = "Sign in";
    document.getElementById("auth-sub").textContent = "Welcome back.";
    document.getElementById("a-dn-f").classList.add("hidden");
    document.getElementById("a-em-f").classList.add("hidden");
    document.getElementById("auth-sw").innerHTML = `No account? <a onclick="showAuthPage('signup')">Sign up</a>`;
  }
};

window.submitAuth = async () => {
  const username = document.getElementById("a-user").value.trim();
  const password = document.getElementById("a-pw").value;
  const errEl = document.getElementById("auth-err");
  errEl.textContent = "";
  if (!username || !password) { errEl.textContent = "All fields required."; return; }
  const hash = hashPw(password);
  if (authMode === "login") {
    try {
      const snap = await getDoc(doc(db, "shop_users", username));
      if (!snap.exists()) { errEl.textContent = "No account found."; return; }
      const data = snap.data();
      if (String(data.passwordHash) !== String(hash) && String(data.passwordHash) !== String(password)) {
        errEl.textContent = "Incorrect password."; return;
      }
      CU = { username, ...data };
      sessionStorage.setItem("cf_user", JSON.stringify(CU));
      onLogin();
    } catch (e) { errEl.textContent = "Error: " + e.message; }
  } else {
    const dn = document.getElementById("a-dn").value.trim();
    const em = document.getElementById("a-em").value.trim();
    if (!dn || !em) { errEl.textContent = "All fields required."; return; }
    if (username.length < 3) { errEl.textContent = "Username must be 3+ characters."; return; }
    try {
      const ex = await getDoc(doc(db, "shop_users", username));
      if (ex.exists()) { errEl.textContent = "Username taken."; return; }
      const newU = {
        displayName: dn, email: em, passwordHash: hash,
        role: "member", purchases: [], worth: 0,
        createdAt: serverTimestamp(),
        verified: false, banned: false, banData: null,
        readTime: 0, showStaffBadge: true
      };
      await setDoc(doc(db, "shop_users", username), newU);
      CU = { username, ...newU };
      sessionStorage.setItem("cf_user", JSON.stringify(CU));
      onLogin();
    } catch (e) { errEl.textContent = "Error: " + e.message; }
  }
};

function onLogin() {
  if (CU.banned) {
    const bd = CU.banData || {};
    const unbanAt = bd.unbanAt ? new Date(bd.unbanAt.seconds * 1000) : null;
    showNav(); updateNav(); goView("home");
    if (unbanAt && new Date() >= unbanAt) { showReactivate(); }
    else { showBanScreen(bd, unbanAt); }
    return;
  }
  showNav(); updateNav();
  readSec = parseInt(sessionStorage.getItem("cf_read") || String(CU.readTime || 0));
  startReadTimer();
  goView("home");
}

function showBanScreen(bd, unbanAt) {
  const dur = bd.duration || "Permanent";
  const mod = bd.moderator || "Staff";
  const note = bd.note || "No note provided.";
  const unbanStr = unbanAt ? unbanAt.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }) : "Never";
  document.getElementById("ban-inner").innerHTML = `
    <div class="ban-box">
      <h2>Account Suspended</h2>
      <p>Your account has been suspended from Cortlin Forums.</p>
      <div class="ban-details">
        <div class="ban-row"><span>Duration</span><span>${esc(dur)}</span></div>
        <div class="ban-row"><span>Unban Date</span><span>${unbanStr}</span></div>
        <div class="ban-row"><span>Moderator</span><span>${esc(mod)}</span></div>
      </div>
      <div class="ban-note">"${esc(note)}"</div>
      <button class="btn btn-outline" style="width:100%;justify-content:center;color:#aaa;border-color:#333;margin-top:4px" onclick="doSignOut()">Sign Out</button>
    </div>`;
  document.getElementById("ban-bg").classList.add("open");
}

function showReactivate() {
  document.getElementById("ban-inner").innerHTML = `
    <div class="ban-box">
      <h2 style="color:#f0f0f0">Welcome Back</h2>
      <p>Your suspension has ended. Agree to the community guidelines to continue.</p>
      <div class="reactivate-check">
        <input type="checkbox" id="ra-chk">
        <label for="ra-chk">I agree to follow the Cortlin community guidelines and Terms of Service.</label>
      </div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px" onclick="reactivate()">Reactivate Account</button>
      <button class="btn btn-outline" style="width:100%;justify-content:center;color:#aaa;border-color:#333;margin-top:8px" onclick="doSignOut()">Sign Out</button>
    </div>`;
  document.getElementById("ban-bg").classList.add("open");
}

window.reactivate = async () => {
  if (!document.getElementById("ra-chk").checked) { toast("Agree to the guidelines first."); return; }
  try {
    await updateDoc(doc(db, "shop_users", CU.username), { banned: false, banData: null });
    CU.banned = false; CU.banData = null;
    sessionStorage.setItem("cf_user", JSON.stringify(CU));
    document.getElementById("ban-bg").classList.remove("open");
    startReadTimer(); updateNav(); goView("home");
  } catch (e) { toast("Error: " + e.message); }
};

window.doSignOut = () => {
  CU = null;
  sessionStorage.removeItem("cf_user");
  sessionStorage.removeItem("cf_read");
  if (readTick) clearInterval(readTick);
  readSec = 0;
  document.getElementById("ban-bg").classList.remove("open");
  document.getElementById("main-nav").classList.add("hidden");
  showAuthPage("login");
};

function startReadTimer() {
  if (readTick) clearInterval(readTick);
  readTick = setInterval(async () => {
    readSec++;
    sessionStorage.setItem("cf_read", String(readSec));
    updateReadUI();
    if (readSec > 0 && readSec % 30 === 0 && CU) {
      try {
        await updateDoc(doc(db, "shop_users", CU.username), { readTime: readSec });
        CU.readTime = readSec;
        sessionStorage.setItem("cf_user", JSON.stringify(CU));
      } catch (e) {}
    }
    if (readSec === READ_REQ) { updateNav(); }
  }, 1000);
}

function updateReadUI() {
  const fill = document.getElementById("read-fill-el");
  const text = document.getElementById("read-text-el");
  if (!fill || !text) return;
  const pct = Math.min(100, (readSec / READ_REQ) * 100);
  fill.style.width = pct + "%";
  if (readSec >= READ_REQ) {
    fill.classList.add("done");
    text.textContent = "Unlocked";
  } else {
    text.textContent = Math.ceil((READ_REQ - readSec) / 60) + "m";
  }
}

async function loadTopics() {
  const el = document.getElementById("topic-list");
  el.innerHTML = `<div class="empty">Loading...</div>`;
  try {
    const snap = await getDocs(collection(db, "forum_topics"));
    const topics = [];
    snap.forEach(d => topics.push({ id: d.id, ...d.data() }));
    if (!topics.length) { el.innerHTML = `<div class="empty">No topics yet.</div>`; return; }
    el.innerHTML = "";
    for (const t of topics) {
      const card = document.createElement("div");
      card.className = "topic-card";
      card.innerHTML = `
        <div class="topic-dot" style="background:${esc(t.color||"#2563eb")}"></div>
        <div class="topic-info"><div class="topic-name">${esc(t.name)}</div><div class="topic-desc">${esc(t.description||"")}</div></div>
        <div class="topic-count">${t.postCount||0} posts</div>`;
      card.addEventListener("click", () => openTopic(t.id, t.name, t.description||""));
      el.appendChild(card);
    }
  } catch (e) { el.innerHTML = `<div class="empty" style="color:var(--danger)">Error: ${e.message}</div>`; }
}

window.openTopic = async (id, name, desc) => {
  curTopicId = id;
  document.getElementById("tv-name").textContent = name;
  document.getElementById("tv-desc").textContent = desc;
  goView("topic");
  await loadPosts(id);
};

async function loadPosts(topicId) {
  const postsEl = document.getElementById("tv-posts");
  const newEl = document.getElementById("tv-new-post");
  postsEl.innerHTML = `<div class="empty">Loading...</div>`;

  if (canPost()) {
    newEl.innerHTML = `
      <div class="new-post-box">
        <h3>New Post</h3>
        <div class="field"><label>Title</label><input id="np-title" type="text" placeholder="Post title"></div>
        <div class="field"><label>Body</label><textarea id="np-body" placeholder="Write something..."></textarea></div>
        <button class="btn btn-primary btn-sm" onclick="submitPost()">Post</button>
      </div>`;
  } else if (CU && !CU.banned) {
    const rem = Math.ceil((READ_REQ - readSec) / 60);
    newEl.innerHTML = `<div class="locked-notice">Keep reading to unlock posting — ${rem} min remaining.</div>`;
  } else if (!CU) {
    newEl.innerHTML = `<div class="locked-notice"><a onclick="showAuthPage('login')">Sign in</a> to participate.</div>`;
  } else {
    newEl.innerHTML = "";
  }

  try {
    const snap = await getDocs(query(collection(db, "forum_posts"), where("topicId", "==", topicId), orderBy("createdAt", "desc")));
    const posts = [];
    snap.forEach(d => posts.push({ id: d.id, ...d.data() }));
    const visible = posts.filter(p => { if (!CU) return p.authorRole === "staff" || p.authorVerified; return true; });
    if (!visible.length) { postsEl.innerHTML = `<div class="empty">No posts yet.</div>`; return; }
    postsEl.innerHTML = "";
    const isStaff = CU && CU.role === "staff";
    for (const p of visible) {
      const card = document.createElement("div");
      card.className = "post-card";
      const bh = buildBadges(p);
      card.innerHTML = `
        <div class="post-card-title">${esc(p.title)}</div>
        <div class="post-card-preview">${esc(p.body)}</div>
        <div class="post-card-meta">
          <div class="author-row"><div class="avatar sm">${ini(p.authorDisplay)}</div><span>${esc(p.authorDisplay)}</span>${bh}</div>
          <span>${fmtDate(p.createdAt)}</span>
          <span>${p.replyCount||0} replies</span>
          ${isStaff ? `<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();staffDelPost('${p.id}')">Delete</button>` : ""}
        </div>`;
      card.addEventListener("click", (e) => { if (e.target.tagName !== "BUTTON") openPost(p); });
      postsEl.appendChild(card);
    }
  } catch (e) { postsEl.innerHTML = `<div class="empty" style="color:var(--danger)">Error: ${e.message}</div>`; }
}

window.submitPost = async () => {
  if (!canPost()) { toast("Keep reading to unlock posting."); return; }
  const title = document.getElementById("np-title")?.value.trim();
  const body = document.getElementById("np-body")?.value.trim();
  if (!title || !body) { toast("Title and body required."); return; }
  try {
    await addDoc(collection(db, "forum_posts"), {
      topicId: curTopicId, title, body,
      authorId: CU.username, authorDisplay: CU.displayName,
      authorRole: CU.role, authorVerified: CU.verified||false,
      showStaffBadge: CU.showStaffBadge !== false,
      replyCount: 0, createdAt: serverTimestamp()
    });
    await updateDoc(doc(db, "forum_topics", curTopicId), { postCount: increment(1) });
    toast("Posted!"); loadPosts(curTopicId);
  } catch (e) { toast("Error: " + e.message); }
};

window.openPost = async (post) => {
  curPostId = post.id;
  document.getElementById("pv-title").textContent = post.title;
  const bh = buildBadges(post);
  const isStaff = CU && CU.role === "staff";
  document.getElementById("pv-meta").innerHTML = `
    <div class="author-row"><div class="avatar sm">${ini(post.authorDisplay)}</div><span>${esc(post.authorDisplay)}</span>${bh}</div>
    <span>${fmtDate(post.createdAt)}</span>
    ${isStaff ? `<button class="btn btn-danger btn-sm" onclick="staffDelPost('${post.id}')">Delete Post</button>` : ""}`;
  document.getElementById("pv-body").textContent = post.body;
  document.getElementById("post-back-btn").onclick = () => { goView("topic"); loadPosts(curTopicId); };
  goView("post");
  await loadReplies(post.id);
};

async function loadReplies(postId) {
  const el = document.getElementById("pv-replies");
  const inputEl = document.getElementById("pv-reply-input");
  el.innerHTML = "";
  try {
    const snap = await getDocs(query(collection(db, "forum_posts", postId, "replies"), orderBy("createdAt", "asc")));
    const replies = [];
    snap.forEach(d => replies.push({ id: d.id, ...d.data() }));
    document.getElementById("pv-reply-count").textContent = `Replies (${replies.length})`;
    const isStaff = CU && CU.role === "staff";
    for (const r of replies) {
      const card = document.createElement("div");
      card.className = "reply-card";
      const bh = buildBadges(r);
      card.innerHTML = `
        <div class="reply-head">
          <div class="avatar sm">${ini(r.authorDisplay)}</div>
          <strong>${esc(r.authorDisplay)}</strong>${bh}
          <span style="color:var(--muted);font-size:12px">${fmtDate(r.createdAt)}</span>
          ${isStaff ? `<button class="btn btn-danger btn-sm" style="margin-left:auto" onclick="staffDelReply('${postId}','${r.id}')">Delete</button>` : ""}
        </div>
        <div class="reply-body">${esc(r.body)}</div>`;
      el.appendChild(card);
    }
    if (canPost()) {
      inputEl.innerHTML = `
        <div class="reply-input-area">
          <textarea id="reply-ta" placeholder="Write a reply..."></textarea>
          <button class="btn btn-primary btn-sm" onclick="submitReply('${postId}')">Reply</button>
        </div>`;
    } else if (CU) {
      const rem = Math.ceil((READ_REQ - readSec) / 60);
      inputEl.innerHTML = `<div class="locked-notice" style="margin-top:12px">${rem} min of reading left to unlock replies.</div>`;
    } else {
      inputEl.innerHTML = `<div class="locked-notice" style="margin-top:12px"><a onclick="showAuthPage('login')">Sign in</a> to reply.</div>`;
    }
  } catch (e) { el.innerHTML = `<div class="empty" style="color:var(--danger)">Error: ${e.message}</div>`; }
}

window.submitReply = async (postId) => {
  if (!canPost()) return;
  const body = document.getElementById("reply-ta")?.value.trim();
  if (!body) { toast("Reply cannot be empty."); return; }
  try {
    await addDoc(collection(db, "forum_posts", postId, "replies"), {
      body, authorId: CU.username, authorDisplay: CU.displayName,
      authorRole: CU.role, authorVerified: CU.verified||false,
      showStaffBadge: CU.showStaffBadge !== false, createdAt: serverTimestamp()
    });
    await updateDoc(doc(db, "forum_posts", postId), { replyCount: increment(1) });
    toast("Reply posted!"); loadReplies(postId);
  } catch (e) { toast("Error: " + e.message); }
};

window.staffDelPost = async (postId) => {
  if (!confirm("Delete this post?")) return;
  try {
    await deleteDoc(doc(db, "forum_posts", postId));
    await updateDoc(doc(db, "forum_topics", curTopicId), { postCount: increment(-1) });
    toast("Post deleted."); goView("topic"); loadPosts(curTopicId);
  } catch (e) { toast("Error: " + e.message); }
};

window.staffDelReply = async (postId, replyId) => {
  if (!confirm("Delete this reply?")) return;
  try {
    await deleteDoc(doc(db, "forum_posts", postId, "replies", replyId));
    await updateDoc(doc(db, "forum_posts", postId), { replyCount: increment(-1) });
    toast("Reply deleted."); loadReplies(postId);
  } catch (e) { toast("Error: " + e.message); }
};

async function loadStaff() {
  if (!CU || CU.role !== "staff") return;
  loadStaffUsers(); loadStaffTopics(); loadStaffPosts();
}

async function loadStaffUsers() {
  const tbody = document.getElementById("staff-users-body");
  tbody.innerHTML = `<tr><td colspan="5">Loading...</td></tr>`;
  try {
    const snap = await getDocs(collection(db, "shop_users"));
    tbody.innerHTML = "";
    snap.forEach(d => {
      const u = d.data(); const un = d.id;
      const banned = u.banned;
      const rClass = banned ? "rp-banned" : u.role === "staff" ? "rp-staff" : "rp-member";
      const rLabel = banned ? "banned" : (u.role || "member");
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><code class="mono" style="font-size:12px">${esc(un)}</code></td>
        <td>${esc(u.displayName)}</td>
        <td><span class="role-pill ${rClass}">${rLabel}</span></td>
        <td>${u.verified ? `<img src="https://en.help.roblox.com/hc/article_attachments/41933934939156" class="badge-img">` : `<span style="color:var(--muted);font-size:12px">No</span>`}</td>

      <select id="ban-dur">

window.submitBan = async (un) => {
  const days = parseInt(document.getElementById("ban-dur").value);
  const note = document.getElementById("ban-note").value.trim();
  const perm = days === 0;
  const dur = perm ? "Permanent" : `${days} day${days>1?"s":""}`;
  const now = new Date();
  const unbanAt = perm ? null : { seconds: Math.floor((now.getTime() + days*86400000)/1000) };
  try {
    await updateDoc(doc(db, "shop_users", un), {
      banned: true,
      banData: { duration: dur, unbanAt, moderator: CU.displayName, note: note||"No note.", bannedAt: { seconds: Math.floor(now.getTime()/1000) } }
    });
    closeMod(); toast("User banned."); loadStaffUsers();
  } catch (e) { toast("Error: " + e.message); }
};

const COLORS = ["#2563eb","#16a34a","#dc2626","#d97706","#7c3aed","#db2777","#0891b2","#ea580c","#111827","#65a30d"];

window.openNewTopicModal = () => {
  document.getElementById("modal-inner").innerHTML = `
    <h2>New Topic</h2>
    <div class="field"><label>Name</label><input type="text" id="nt-name" placeholder="Topic name"></div>
    <div class="field"><label>Description</label><input type="text" id="nt-desc" placeholder="Short description"></div>
    <div class="field"><label>Color</label>
      <div class="color-swatches">${COLORS.map((c,i) => `<div class="cswatch${i===0?" on":""}" style="background:${c}" data-c="${c}" onclick="pickColor(this)"></div>`).join("")}</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeMod()">Cancel</button>
      <button class="btn btn-primary" onclick="submitNewTopic()">Create</button>
    </div>`;
  document.getElementById("modal-bg").classList.add("open");
};

window.pickColor = (el) => {
  document.querySelectorAll(".cswatch").forEach(s => s.classList.remove("on"));
  el.classList.add("on");
};

window.submitNewTopic = async () => {
  const name = document.getElementById("nt-name").value.trim();
  if (!name) { toast("Name required."); return; }
  const desc = document.getElementById("nt-desc").value.trim();
  const sel = document.querySelector(".cswatch.on");
  const color = sel ? sel.dataset.c : COLORS[0];
  try {
    await addDoc(collection(db, "forum_topics"), { name, description: desc, color, postCount: 0, createdAt: serverTimestamp(), createdBy: CU.username });
    closeMod(); toast("Topic created!"); loadStaffTopics();
  } catch (e) { toast("Error: " + e.message); }
};

window.delTopic = async (id) => {
  if (!confirm("Delete this topic?")) return;
  try {
    await deleteDoc(doc(db, "forum_topics", id));
    toast("Topic deleted."); loadStaffTopics();
  } catch (e) { toast("Error: " + e.message); }
};

window.closeMod = () => document.getElementById("modal-bg").classList.remove("open");

window.switchPTab = (tab, btn) => {
  document.querySelectorAll(".ptab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".psec").forEach(s => s.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("psec-" + tab).classList.add("active");
};

function loadSettings() {
  if (!CU) return;
  document.getElementById("set-acct-info").textContent = `${CU.displayName} (@${CU.username})`;
  const sbRow = document.getElementById("srow-staff-badge");
  if (CU.role === "staff") {
    sbRow.style.display = "flex";
    document.getElementById("tog-staff-badge").checked = CU.showStaffBadge !== false;
  } else {
    sbRow.style.display = "none";
  }
}

window.saveStaffBadge = async (val) => {
  try {
    await updateDoc(doc(db, "shop_users", CU.username), { showStaffBadge: val });
    CU.showStaffBadge = val;
    sessionStorage.setItem("cf_user", JSON.stringify(CU));
    updateNav(); toast("Saved.");
  } catch (e) { toast("Error: " + e.message); }
};

const saved = sessionStorage.getItem("cf_user");
if (saved) {
  try {
    CU = JSON.parse(saved);
    readSec = parseInt(sessionStorage.getItem("cf_read") || String(CU.readTime || 0));
    onLogin();
  } catch { showAuthPage("login"); }
} else {
  showAuthPage("login");
}
</script>
</body>
</html>
