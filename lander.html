<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortlin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html,body{height:100%;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif}
#gate{position:fixed;inset:0;overflow-y:auto;background:#fff;display:flex;justify-content:center;align-items:flex-start;padding:48px 20px}
#box{width:100%;max-width:780px;display:flex;flex-direction:column;gap:24px}
#box h1{font-size:30px;font-weight:bold;padding-bottom:16px;border-bottom:2px solid #000}
#eula{height:340px;overflow-y:auto;border:1px solid #c8c8c8;padding:20px;font-size:16px;line-height:1.65;white-space:pre-wrap;background:#fff}
#hint{font-size:15px;color:#666;min-height:20px;margin-top:-12px}
#agreeRow{display:flex;align-items:center;gap:14px;font-size:18px;cursor:pointer}
#agreeRow.off{color:#aaa;cursor:not-allowed}
#agree{width:24px;height:24px;accent-color:#000;cursor:inherit}
#capRow{display:flex;align-items:center;gap:12px}
#cap{border:1px solid #c8c8c8;background:#fff;display:block}
#reload{width:90px;height:90px;background:#fff;border:1px solid #c8c8c8;color:#000;font-size:28px;cursor:pointer}
#reload:hover{background:#f2f2f2}
#capIn{width:100%;height:68px;padding:0 18px;background:#fff;border:1px solid #c8c8c8;color:#000;font-size:30px;letter-spacing:8px;text-transform:uppercase;outline:none}
#capIn:focus{border-color:#000}
#go{height:68px;background:#000;border:1px solid #000;color:#fff;font-size:20px;font-weight:bold;letter-spacing:1px;cursor:pointer}
#go:hover:not(:disabled){background:#222}
#go:disabled{background:#f2f2f2;border-color:#e0e0e0;color:#aaa;cursor:not-allowed}
#msg{min-height:22px;font-size:16px;color:#b00020;margin-top:-8px}
#nf{display:none;position:fixed;inset:0;background:#fff;color:#000;font-family:Times New Roman,serif;text-align:center;padding-top:12vh}
#nf h1{font-size:34px;font-weight:bold;margin-bottom:10px}
#nf hr{width:90%;margin:14px auto;border:0;border-top:1px solid #999}
#nf p{font-size:18px}
@media(max-width:560px){
  #box h1{font-size:24px}
  #eula{height:280px;font-size:15px}
  #agreeRow{font-size:16px}
  #cap{width:100%;height:auto}
  #reload{width:72px;height:72px}
  #capIn{font-size:24px;letter-spacing:6px}
}
</style>
</head>
<body>

<div id="gate">
  <div id="box">
    <h1>Cortlin End User License Agreement</h1>
    <div id="eula">Loading...</div>
    <div id="hint">Scroll to the bottom to continue.</div>
    <label id="agreeRow" class="off"><input type="checkbox" id="agree" disabled> I agree to the Cortlin End User License Agreement</label>
    <div id="capRow">
      <canvas id="cap" width="300" height="90"></canvas>
      <button id="reload" type="button" title="New code">&#8635;</button>
    </div>
    <input type="text" id="capIn" maxlength="6" autocomplete="off" spellcheck="false">
    <button id="go" type="button" disabled>Submit</button>
    <div id="msg"></div>
  </div>
</div>

<div id="nf">
  <h1>404 Not Found</h1>
  <hr>
  <p>nginx</p>
</div>
