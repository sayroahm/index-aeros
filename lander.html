<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortlin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html,body{height:100%;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#fff}
#box{width:100%;max-width:540px;border:1px solid #bbb;padding:24px;display:flex;flex-direction:column;gap:14px}
#box h1{font-size:17px;font-weight:bold}
#eula{height:220px;overflow-y:auto;border:1px solid #bbb;padding:10px;font-size:13px;line-height:1.5;white-space:pre-wrap}
#hint{font-size:12px;color:#666;min-height:14px}
#agreeRow{display:flex;align-items:center;gap:8px;font-size:14px}
#agreeRow.off{color:#999}
#capRow{display:flex;align-items:center;gap:8px}
#cap{border:1px solid #bbb;background:#fff}
#reload{background:#fff;border:1px solid #bbb;color:#111;padding:8px 11px;cursor:pointer;font-size:15px}
#reload:hover{background:#eee}
#capIn{width:100%;padding:9px;background:#fff;border:1px solid #bbb;color:#111;font-size:15px;letter-spacing:2px;text-transform:uppercase;outline:none}
#capIn:focus{border-color:#111}
#go{padding:10px;background:#111;border:1px solid #111;color:#fff;font-size:14px;cursor:pointer}
#go:disabled{background:#eee;border-color:#ddd;color:#999;cursor:not-allowed}
#msg{min-height:16px;font-size:13px;color:#b00020}
#nf{display:none;position:fixed;inset:0;background:#fff;color:#000;font-family:Times New Roman,serif;text-align:center;padding-top:12vh}
#nf h1{font-size:32px;font-weight:bold;margin-bottom:10px}
#nf hr{width:90%;margin:14px auto;border:0;border-top:1px solid #999}
</style>
</head>
<body>

<div id="gate">
  <div id="box">
    <h1>Cortlin End User License Agreement</h1>
    <div id="eula">Loading...</div>
    <div id="hint">Scroll to the bottom to continue.</div>
    <label id="agreeRow" class="off"><input type="checkbox" id="agree" disabled> I agree to the Cortlin End User License Agreement</label>
    <div id="capRow">
      <canvas id="cap" width="190" height="60"></canvas>
      <button id="reload" type="button" title="New code">&#8635;</button>
    </div>
    <input type="text" id="capIn" maxlength="6" autocomplete="off" spellcheck="false" placeholder="Type the letters">
    <button id="go" type="button" disabled>Submit</button>
    <div id="msg"></div>
  </div>
</div>

<div id="nf">
  <h1>404 Not Found</h1>
  <hr>
  <p>nginx</p>
</div>

<script>
(function(){
  var KEY = "cortlinEulaAccepted";
  var VER = "v1";
  var URL_EULA = "https://storage.cortlin.us/txt/eula.txt";
  var CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var LEN = 5;
  var MAX_TRIES = 5;
  var LOCK_MS = 30000;

  var gate = document.getElementById("gate");
  var nf = document.getElementById("nf");
  var eula = document.getElementById("eula");
  var hint = document.getElementById("hint");
  var row = document.getElementById("agreeRow");
  var agree = document.getElementById("agree");
  var cap = document.getElementById("cap");
  var ctx = cap.getContext("2d");
  var capIn = document.getElementById("capIn");
  var go = document.getElementById("go");
  var reload = document.getElementById("reload");
  var msg = document.getElementById("msg");

  var answer = "";
  var tries = 0;
  var locked = false;
  var scrolled = false;
  var eulaOk = false;

  function store(k, v){
    try{ if(v === undefined){ return localStorage.getItem(k); } localStorage.setItem(k, v); return true; }
    catch(e){ return null; }
  }

  function show404(){
    gate.style.display = "none";
    nf.style.display = "block";
    document.title = "404 Not Found";
  }

  function rnd(a, b){ return Math.random() * (b - a) + a; }

  function makeCode(){
    var s = "";
    var arr = new Uint32Array(LEN);
    if(window.crypto && crypto.getRandomValues){
      crypto.getRandomValues(arr);
      for(var i = 0; i < LEN; i++){ s += CHARS[arr[i] % CHARS.length]; }
    } else {
      for(var j = 0; j < LEN; j++){ s += CHARS[Math.floor(Math.random() * CHARS.length)]; }
    }
    return s;
  }

  function drawCaptcha(){
    answer = makeCode();
    var w = cap.width, h = cap.height;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, w, h);

    for(var i = 0; i < 6; i++){
      var g = Math.floor(rnd(150, 210));
      ctx.strokeStyle = "rgb(" + g + "," + g + "," + g + ")";
      ctx.lineWidth = rnd(1, 2);
      ctx.beginPath();
      ctx.moveTo(rnd(0, w), rnd(0, h));
      ctx.bezierCurveTo(rnd(0,w), rnd(0,h), rnd(0,w), rnd(0,h), rnd(0, w), rnd(0, h));
      ctx.stroke();
    }

    var step = (w - 30) / LEN;
    for(var k = 0; k < answer.length; k++){
      var size = Math.floor(rnd(28, 38));
      var shade = Math.floor(rnd(10, 70));
      ctx.save();
      ctx.translate(16 + step * k + step / 2, h / 2 + rnd(-6, 6));
      ctx.rotate(rnd(-0.4, 0.4));
      ctx.font = "bold " + size + "px Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "rgb(" + shade + "," + shade + "," + shade + ")";
      ctx.fillText(answer[k], 0, 0);
      ctx.restore();
    }

    for(var d = 0; d < 80; d++){
      var c = Math.floor(rnd(120, 200));
      ctx.fillStyle = "rgb(" + c + "," + c + "," + c + ")";
      ctx.fillRect(rnd(0, w), rnd(0, h), 1.5, 1.5);
    }

    ctx.strokeStyle = "rgb(120,120,120)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    var y0 = rnd(18, h - 18);
    ctx.moveTo(0, y0);
    for(var x = 0; x <= w; x += 6){ ctx.lineTo(x, y0 + Math.sin(x / 9 + rnd(0, 1)) * 6); }
    ctx.stroke();
  }

  function refreshBtn(){
    go.disabled = locked || !eulaOk || !scrolled || !agree.checked || capIn.value.trim().length === 0;
  }

  function setMsg(t){ msg.textContent = t || ""; }

  function unlockAgree(){
    if(scrolled) return;
    scrolled = true;
    agree.disabled = false;
    row.classList.remove("off");
    hint.textContent = "";
    refreshBtn();
  }

  function checkScroll(){
    var atEnd = eula.scrollTop + eula.clientHeight >= eula.scrollHeight - 4;
    if(atEnd && eulaOk) unlockAgree();
  }

  function loadEula(){
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 10000);
    fetch(URL_EULA, { cache: "no-cache", signal: ctrl ? ctrl.signal : undefined })
      .then(function(r){
        if(!r.ok) throw new Error("status " + r.status);
        return r.text();
      })
      .then(function(t){
        clearTimeout(timer);
        if(!t.trim()) throw new Error("empty");
        eula.textContent = t;
        eulaOk = true;
        setTimeout(checkScroll, 50);
        refreshBtn();
      })
      .catch(function(){
        clearTimeout(timer);
        eula.textContent = "Couldn't load the agreement. Check your connection and reload the page.";
        hint.textContent = "";
        eulaOk = false;
        refreshBtn();
      });
  }

  function lockout(){
    locked = true;
    var left = LOCK_MS / 1000;
    refreshBtn();
    var iv = setInterval(function(){
      left--;
      setMsg("Too many attempts. Try again in " + left + "s");
      if(left <= 0){
        clearInterval(iv);
        locked = false;
        tries = 0;
        setMsg("");
        drawCaptcha();
        refreshBtn();
      }
    }, 1000);
    setMsg("Too many attempts. Try again in " + left + "s");
  }

  function submit(){
    if(locked) return;
    if(!agree.checked){ setMsg("You need to agree to the EULA first."); return; }
    var typed = capIn.value.trim().toUpperCase();
    if(typed === answer){
      store(KEY, VER);
      show404();
      return;
    }
    tries++;
    capIn.value = "";
    drawCaptcha();
    refreshBtn();
    if(tries >= MAX_TRIES){ lockout(); return; }
    setMsg("Wrong code. " + (MAX_TRIES - tries) + " attempts left.");
  }

  if(store(KEY) === VER){
    show404();
    return;
  }

  eula.addEventListener("scroll", checkScroll);
  agree.addEventListener("change", refreshBtn);
  capIn.addEventListener("input", function(){ capIn.value = capIn.value.replace(/[^a-zA-Z0-9]/g, ""); refreshBtn(); });
  capIn.addEventListener("keydown", function(e){ if(e.key === "Enter" && !go.disabled) submit(); });
  go.addEventListener("click", submit);
  reload.addEventListener("click", function(){ drawCaptcha(); capIn.value = ""; setMsg(""); refreshBtn(); capIn.focus(); });

  drawCaptcha();
  loadEula();
})();
</script>
</body>
</html>
