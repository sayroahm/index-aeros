<!doctype html>
<html>
  <head>
    <title>Page not found</title>
  </head>
  <body>
    <h2>Sorry! (404)</h2>
    <p>The requested page you entered could not be found within our directory.</p>
    <p>Check for spelling typos or try again later.</p>

    <button id="goback">Index</button>

    <script>
      const btn = document.getElementById("goback");

      btn.addEventListener("click", () => {
        window.location.href = "https://nbep-us.com";
      });
    </script>
  </body>
</html>
