<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View — Cortlin</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: monospace; font-size: 14px; background: #fff; color: #000; padding: 20px 40px; }
h1 { font-size: 16px; font-weight: bold; margin-bottom: 10px; }
hr { border: none; border-top: 1px solid #000; margin-bottom: 16px; }
#content { white-space: pre-wrap; font-size: 13px; line-height: 1.6; }
#meta { color: #666; font-size: 12px; margin-bottom: 10px; }
a { color: #00e; text-decoration: underline; cursor: pointer; }
#edit-bar { margin-top: 16px; display: none; }
#edit-bar textarea { font-family: monospace; font-size: 13px; width: 100%; height: 200px; border: 1px solid #999; padding: 6px; display: block; margin-bottom: 6px; resize: vertical; }
#edit-bar button { font-family: monospace; font-size: 13px; background: none; border: 1px solid #000; padding: 4px 12px; cursor: pointer; margin-right: 6px; }
#edit-bar button:hover { background: #eee; }
#status-msg { margin-top: 8px; font-size: 12px; color: #666; }
</style>
</head>
<body>

<!-- ✅ Safe navigation back to index — no dynamic data involved -->
<a href="index.html">← index</a>
<br><br>

<h1 id="item-title">loading...</h1>
<div id="meta"></div>
<hr>
<div id="content"></div>

<div id="edit-bar">
  <textarea id="edit-area"></textarea>
  <button id="save-btn">Save</button>
  <button id="cancel-btn">Cancel</button>
  <div id="status-msg"></div>
</div>

<div id="action-bar" style="margin-top:12px;"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAfb1PKVSPEuVPzdb3BE9fbMtT8Yade-hY",
  authDomain: "cortlin.firebaseapp.com",
  projectId: "cortlin",
  storageBucket: "cortlin.firebasestorage.app",
  messagingSenderId: "439783582358",
  appId: "1:439783582358:web:ef40a524daaa6d0a77f0b7",
  measurementId: "G-LC1C1X95G6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const currentUser = JSON.parse(sessionStorage.getItem("cortlin_user") || "null");

// ✅ FIX: decodeURIComponent matches the encodeURIComponent used in index.html
const rawId = new URLSearchParams(location.search).get("id");
const id = rawId ? decodeURIComponent(rawId) : null;

let itemData = null;

// ✅ Wire up edit bar buttons safely via addEventListener — no inline onclick
document.getElementById("save-btn").addEventListener("click", saveContent);
document.getElementById("cancel-btn").addEventListener("click", () => {
  document.getElementById("edit-bar").style.display = "none";
  document.getElementById("status-msg").textContent = "";
});

async function load() {
  // ✅ FIX: Full try/catch — errors now show on page instead of silently killing it
  try {
    if (!id) {
      document.getElementById("item-title").textContent = "no item specified";
      document.getElementById("content").textContent = "No document ID was provided in the URL.";
      return;
    }

    const snap = await getDoc(doc(db, "tree", id));

    if (!snap.exists()) {
      document.getElementById("item-title").textContent = "not found";
      document.getElementById("content").textContent = `No document found with ID: ${id}`;
      return;
    }

    itemData = snap.data();

    // Locked check
    if (itemData.locked && !currentUser) {
      document.getElementById("item-title").textContent = "access denied";
      document.getElementById("content").textContent = "this item is restricted to staff.";
      return;
    }

    // Render title
    document.title = `${itemData.name} — Cortlin`;
    document.getElementById("item-title").textContent = itemData.name;

    // Render meta
    const mod = itemData.modified
      ? new Date(itemData.modified.seconds * 1000).toISOString().slice(0, 16).replace("T", " ")
      : "-";
    document.getElementById("meta").textContent =
      `modified: ${mod}${itemData.description ? " — " + itemData.description : ""}${itemData.locked ? " [staff only]" : ""}`;

    // Render content
    const contentEl = document.getElementById("content");
    if (itemData.url) {
      // External URL entry — safe anchor
      const link = document.createElement("a");
      link.href = itemData.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = `→ ${itemData.url}`;
      contentEl.appendChild(link);
    } else {
      // Text/body entry
      contentEl.textContent = itemData.body || "(no content)";
    }

    // Show edit button for logged-in users
    if (currentUser) {
      const editLink = document.createElement("a");
      editLink.textContent = "edit";
      editLink.style.cursor = "pointer";
      editLink.addEventListener("click", startEdit);
      document.getElementById("action-bar").appendChild(editLink);
    }

  } catch (err) {
    // ✅ FIX: Instead of blank page, show the actual error
    document.getElementById("item-title").textContent = "error loading document";
    document.getElementById("content").textContent = `Something went wrong: ${err.message}\n\nCheck the browser console for details.`;
    console.error("view.html load() error:", err);
  }
}

function startEdit() {
  document.getElementById("edit-area").value = itemData.body || "";
  document.getElementById("edit-bar").style.display = "block";
  document.getElementById("status-msg").textContent = "";
  document.getElementById("edit-area").focus();
}

async function saveContent() {
  const statusEl = document.getElementById("status-msg");
  const body = document.getElementById("edit-area").value;
  statusEl.textContent = "saving...";
  try {
    await updateDoc(doc(db, "tree", id), { body, modified: serverTimestamp() });
    itemData.body = body;
    document.getElementById("content").textContent = body;
    document.getElementById("edit-bar").style.display = "none";
    statusEl.textContent = "";
  } catch (err) {
    statusEl.textContent = `save failed: ${err.message}`;
    console.error("saveContent error:", err);
  }
}

load();
</script>
</body>
</html>
