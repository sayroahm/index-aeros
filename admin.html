<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Cortlin</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: monospace; font-size: 14px; background: #fff; color: #000; padding: 20px 40px; }
h1 { font-size: 16px; font-weight: bold; margin-bottom: 4px; }
hr { border: none; border-top: 1px solid #000; margin: 10px 0; }
h2 { font-size: 14px; font-weight: bold; margin-bottom: 8px; }
table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
th { text-align: left; font-weight: normal; text-decoration: underline; padding: 2px 12px 2px 0; }
td { padding: 2px 12px 2px 0; }
a { color: #00e; text-decoration: underline; cursor: pointer; }
input { font-family: monospace; font-size: 13px; border: 1px solid #999; padding: 3px 6px; margin-right: 6px; width: 150px; }
button { font-family: monospace; font-size: 13px; background: none; border: 1px solid #000; padding: 3px 10px; cursor: pointer; }
button:hover { background: #eee; }
#msg { font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<div><a onclick="window.location='index.html'">← index</a></div>
<br>
<h1>Cortlin — Admin Panel</h1>
<div id="access-check">checking access...</div>
<div id="panel" style="display:none">
  <hr>
  <h2>Users</h2>
  <table>
    <thead><tr><th>Username</th><th>Email</th><th>Role</th><th></th></tr></thead>
    <tbody id="user-table"></tbody>
  </table>
  <h2>Add Staff User</h2>
  <input id="new-user" type="text" placeholder="username">
  <input id="new-email" type="text" placeholder="email">
  <input id="new-pass" type="text" placeholder="password">
  <input id="new-role" type="text" placeholder="role (staff/admin)">
  <button onclick="addUser()">Add</button>
  <div id="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-analytics.js";
import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAfb1PKVSPEuVPzdb3BE9fbMtT8Yade-hY",
  authDomain: "cortlin.firebaseapp.com",
  projectId: "cortlin",
  storageBucket: "cortlin.firebasestorage.app",
  messagingSenderId: "439783582358",
  appId: "1:439783582358:web:ef40a524daaa6d0a77f0b7",
  measurementId: "G-LC1C1X95G6"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getFirestore(app);
const auth = getAuth(app);

onAuthStateChanged(auth, async user => {
  const check = document.getElementById("access-check");
  if (!user) {
    check.innerHTML = `not logged in. <a onclick="window.location='login.html'">login</a>`;
    return;
  }
  const snap = await getDocs(query(collection(db, "users"), where("email", "==", user.email), where("role", "==", "admin")));
  if (snap.empty) { check.textContent = "access denied — admins only."; return; }
  check.style.display = "none";
  document.getElementById("panel").style.display = "block";
  loadUsers();
});

async function loadUsers() {
  const tbody = document.getElementById("user-table");
  tbody.innerHTML = "";
  const snap = await getDocs(collection(db, "users"));
  snap.forEach(d => {
    const data = d.data();
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${data.user || ""}</td><td>${data.email || ""}</td><td>${data.role || "staff"}</td><td><a onclick="removeUser('${d.id}')">remove</a></td>`;
    tbody.appendChild(tr);
  });
}

window.addUser = async () => {
  const user = document.getElementById("new-user").value.trim();
  const email = document.getElementById("new-email").value.trim();
  const pass = document.getElementById("new-pass").value.trim();
  const role = document.getElementById("new-role").value.trim() || "staff";
  const msg = document.getElementById("msg");
  if (!user || !email || !pass) { msg.textContent = "username, email, and password are required."; msg.style.color = "#c00"; return; }
  try {
    await createUserWithEmailAndPassword(auth, email, pass);
    await addDoc(collection(db, "users"), { user, email, password: pass, role });
    msg.textContent = `user "${user}" created.`;
    msg.style.color = "#060";
    loadUsers();
  } catch (err) {
    msg.textContent = err.message;
    msg.style.color = "#c00";
  }
};

window.removeUser = async (id) => {
  if (!confirm("remove this user from the database?")) return;
  await deleteDoc(doc(db, "users", id));
  loadUsers();
};
</script>
</body>
</html>
