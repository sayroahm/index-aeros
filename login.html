<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Cortlin</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: monospace; font-size: 14px; background: #fff; color: #000; padding: 40px; }
h1 { font-size: 16px; font-weight: bold; margin-bottom: 4px; }
p { font-size: 13px; margin-bottom: 20px; color: #444; }
hr { border: none; border-top: 1px solid #000; margin-bottom: 20px; }
label { display: block; font-size: 12px; margin-bottom: 2px; }
input { display: block; width: 320px; font-family: monospace; font-size: 13px; border: 1px solid #999; padding: 4px 6px; margin-bottom: 12px; }
button { font-family: monospace; font-size: 13px; background: none; border: 1px solid #000; padding: 5px 16px; cursor: pointer; }
button:hover { background: #eee; }
#msg { margin-top: 12px; font-size: 13px; color: #c00; }
#back { font-size: 13px; margin-top: 16px; }
#back a { color: #00e; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>
<h1>Cortlin — Staff Login</h1>
<p>Access restricted. Authorized personnel only.</p>
<hr>
<label>Username</label>
<input id="uname" type="text" autocomplete="username">
<label>Password</label>
<input id="pass" type="password" autocomplete="current-password">
<button onclick="doLogin()">Login</button>
<div id="msg"></div>
<div id="back"><a onclick="window.location='index.html'">← back to index</a></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-analytics.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAfb1PKVSPEuVPzdb3BE9fbMtT8Yade-hY",
  authDomain: "cortlin.firebaseapp.com",
  projectId: "cortlin",
  storageBucket: "cortlin.firebasestorage.app",
  messagingSenderId: "439783582358",
  appId: "1:439783582358:web:ef40a524daaa6d0a77f0b7",
  measurementId: "G-LC1C1X95G6"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getFirestore(app);
const auth = getAuth(app);

window.doLogin = async () => {
  const username = document.getElementById("uname").value.trim();
  const password = document.getElementById("pass").value;
  const msg = document.getElementById("msg");
  msg.textContent = "checking...";
  msg.style.color = "#444";
  try {
    const q = query(collection(db, "users"), where("user", "==", username), where("password", "==", password));
    const snap = await getDocs(q);
    if (snap.empty) { msg.textContent = "invalid username or password."; msg.style.color = "#c00"; return; }
    const email = snap.docs[0].data().email;
    if (!email) { msg.textContent = "account not configured. contact admin."; msg.style.color = "#c00"; return; }
    await signInWithEmailAndPassword(auth, email, password);
    window.location = "index.html";
  } catch (err) {
    msg.textContent = err.message;
    msg.style.color = "#c00";
  }
};

document.getElementById("pass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
</script>
</body>
</html>
